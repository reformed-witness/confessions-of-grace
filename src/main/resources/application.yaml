spring:
  application:
    name: confessions-of-grace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confessions_of_grace}
    username: ${DB_USER:confessions_of_grace}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

platform:
  web:
    spa:
      enabled: true
  data:
    auditing:
      enabled: true
  storage:
    endpoint: ${S3_ENDPOINT:https://s3.thebennett.net}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: true
  security:
    # Public site: ONLY the admin API needs an Authentik login — pages, static assets (/images, /data,
    # /assets) and the public API are all open. An allowlist would mean enumerating every static
    # directory, and anything missed 401s. mode=OIDC is set in the deploy env (tests default to NONE).
    authenticated-paths:
      - /api/admin/**

bennett:
  storage:
    bucket: ${COG_BUCKET:confessions-of-grace}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
